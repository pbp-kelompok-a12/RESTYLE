{# Menu kiri. Dipakai di halaman feed dan Saved. #}
<nav class="cm-side" aria-label="Community menu">
    <a href="{% url 'community:show_community' %}" class="cm-side-link {% if active == 'all' %}is-active{% endif %}">
        <i class="fa-solid fa-house"></i> All posts
    </a>
    <hr>
    {% if user.is_authenticated %}
    <a href="{% url 'community:show_user_profile' user.username %}#posts" class="cm-side-link {% if active == 'mine' %}is-active{% endif %}">
        <i class="fa-regular fa-message"></i> My posts
    </a>
    <a href="{% url 'community:show_saved' %}" class="cm-side-link {% if active == 'saved' %}is-active{% endif %}">
        <i class="fa-regular fa-bookmark"></i> Saved
    </a>
    <a href="{% url 'community:show_community' %}#composer" class="cm-btn cm-btn-primary cm-side-post">Post</a>
    {% else %}
    <a href="{% url 'main:login' %}" class="cm-side-link {% if active == 'mine' %}is-active{% endif %}">
        <i class="fa-regular fa-message"></i> My posts
    </a>
    <a href="{% url 'main:login' %}" class="cm-side-link {% if active == 'saved' %}is-active{% endif %}">
        <i class="fa-regular fa-bookmark"></i> Saved
    </a>
    <a href="{% url 'main:login' %}" class="cm-btn cm-btn-primary cm-side-post">Post</a>
    {% endif %}
</nav>
