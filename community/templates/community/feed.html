{% extends 'base.html' %}

{% block meta %}
    <title>Community | RE:STYLE</title>
{% endblock meta %}

{% block content %}
<main style="padding: 140px 40px 40px;">
    <h1>Fashion Community</h1>

    {% for post in posts %}
    <article style="margin-top: 24px;">
        <p><strong>@{{ post.username }}</strong> · {{ post.time }}</p>
        <p>{{ post.content }}</p>
        <p>{{ post.likes }} likes · {{ post.replies }} replies</p>
    </article>
    {% endfor %}
</main>
{% endblock content %}
