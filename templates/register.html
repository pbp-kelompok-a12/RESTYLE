{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-md">
    <h2 class="text-center text-3xl font-extrabold text-gray-900">Daftar Akun RE:STYLE</h2>

    <form class="mt-8 space-y-6" method="POST">
      {% csrf_token %}
      <div class="space-y-4">
        {{ form.as_p }}
      </div>
      <button type="submit" class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">
        Register
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
      Sudah punya akun? <a href="{% url 'main:login' %}" class="text-indigo-600 hover:underline">Login di sini</a>
    </p>
  </div>
</div>
{% endblock %}
